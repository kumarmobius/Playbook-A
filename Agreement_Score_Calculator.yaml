name: Agreement Score Calculator V1.2
inputs:
  - {name: embeddings,     type: Data,    description: "Path to mock_embeddings.csv"}
  - {name: regime_dim,     type: Integer, default: "32",          description: "Dimensionality of each regime embedding vector"}
  - {name: output_mode,    type: String,  default: "latest",    description: "Output mode: 'latest' for latest year only, 'all' for all years"}
  - {name: round_decimals, type: Integer, default: "6",           description: "Decimal places to round agreement scores"}

outputs:
  - {name: agreement_scores, type: Data, description: "agreement_scores.csv (latest year, indexed by market)"}
  - {name: agreement_scores_all_years, type: Data, description: "agreement_scores_all_years.csv (all years, no index)"}

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v1
    command:
      - python3
      - -u
      - -c
      - |
        import argparse, os, sys, json, logging
        import numpy as np
        import pandas as pd

        parser = argparse.ArgumentParser()
        parser.add_argument('--embeddings',                  required=True)
        parser.add_argument('--regime_dim',                  type=int,   default=32)
        parser.add_argument('--output_mode',                 type=str,   default='latest',
                            choices=['latest', 'all'],
                            help="'latest' = latest year per market; 'all' = every year")
        parser.add_argument('--round_decimals',              type=int,   default=6)
        parser.add_argument('--agreement_scores',            required=True)
        parser.add_argument('--agreement_scores_all_years',  required=True)
        args = parser.parse_args()

        logging.basicConfig(stream=sys.stdout, level=logging.INFO)
        logger = logging.getLogger("agreement_score_calculator")

        REGIME_DIM = args.regime_dim

        # ============================================================
        # Hardcoded: SUB_REGIME_SLICES
        # ============================================================
        SUB_REGIME_SLICES = {
            "supply_dims":  ("coordination", 0,  11),
            "buyer_dims":   ("coordination", 11, 21),
            "rivalry_dims": ("coordination", 21, 32),
            "entry_dims":   ("regulatory",   0,  11),
            "sub_dims":     ("techprod",     0,  11),
            "env_dims":     ("narrative",    0,  11),
        }

        # ============================================================
        # Hardcoded: FIELD_CONFIG
        # (target_regime, [comparison_regimes], inverted)
        # ============================================================
        FIELD_CONFIG = {
            "PESTLE_P":        ("political",    ["measurement", "coordination", "operational", "regulatory"], False),
            "PESTLE_E":        ("measurement",  ["coordination", "operational", "techprod"],                  False),
            "PESTLE_S":        ("operational",  ["measurement",  "narrative",   "coordination"],              False),
            "PESTLE_T":        ("techprod",     ["measurement",  "coordination","operational"],               False),
            "PESTLE_L":        ("regulatory",   ["political",    "coordination","operational"],               False),
            "PESTLE_Env":      ("env_dims",     ["measurement",  "regulatory"],                               False),
            "5F_Supplier":     ("supply_dims",  ["regulatory",   "incentive"],                                False),
            "5F_Buyer":        ("buyer_dims",   ["operational",  "incentive"],                                False),
            "5F_NewEntrant":   ("entry_dims",   ["political",    "coordination","techprod"],                  False),
            "5F_Substitute":   ("sub_dims",     ["coordination", "operational"],                              False),
            "5F_Rivalry":      ("rivalry_dims", ["incentive",    "regulatory"],                               False),
            "Contractibility": ("regulatory",   ["operational",  "coordination"],                             False),
            "DataExhaust":     ("techprod",     ["operational",  "coordination"],                             False),
            "StdGap":          ("techprod",     ["regulatory"],                                               True),
        }

        # ============================================================
        # Vector Helpers
        # ============================================================
        def get_base_vec(row, regime):
            cols = [f"{regime}__{i}" for i in range(REGIME_DIM)]
            if not all(c in row for c in cols):
                return None
            return np.array([float(row[c]) for c in cols], dtype=np.float32)

        def get_regime_vec(row, key):
            if key in SUB_REGIME_SLICES:
                parent, s, e = SUB_REGIME_SLICES[key]
                parent_vec = get_base_vec(row, parent)
                return parent_vec[s:e] if parent_vec is not None else None
            return get_base_vec(row, key)

        def safe_cosine(a, b, target_dim):
            if a is None or b is None:
                return np.nan
            b_t = b[:target_dim] if len(b) > target_dim else b
            a_t = a[:target_dim] if len(a) > target_dim else a
            if len(a_t) != len(b_t):
                return np.nan
            na, nb = np.linalg.norm(a_t), np.linalg.norm(b_t)
            if na == 0 or nb == 0 or not np.isfinite(na) or not np.isfinite(nb):
                return np.nan
            return float(np.dot(a_t, b_t) / (na * nb))

        # ============================================================
        # Agreement Score Computation
        # ============================================================
        def compute_agreement_row(row):
            results = {}
            for field, (target, others, inverted) in FIELD_CONFIG.items():
                tgt = get_regime_vec(row, target)
                if tgt is None:
                    results[field] = np.nan
                    continue
                target_dim = len(tgt)
                sims = [safe_cosine(tgt, get_regime_vec(row, o), target_dim) for o in others]
                sims = [s for s in sims if not np.isnan(s)]
                if sims:
                    raw = float(np.mean(sims))
                    results[field] = round((1.0 - raw) if inverted else raw, args.round_decimals)
                else:
                    results[field] = np.nan
            return results

        def compute_all(df):
            records = []
            for _, row in df.iterrows():
                d      = row.to_dict()
                scores = compute_agreement_row(d)
                record = {"market": row["market"], "year": int(row["year"])}
                record.update(scores)
                records.append(record)
            return pd.DataFrame(records)

        def get_latest_year(df_all):
            idx = df_all.groupby("market")["year"].idxmax()
            return df_all.loc[idx].drop(columns=["year"]).set_index("market")

        def report_nulls(df):
            null_counts = df.isna().sum()
            null_counts  = null_counts[null_counts > 0]
            if not null_counts.empty:
                logger.warning("Null agreement scores detected:")
                for field, cnt in null_counts.items():
                    markets = df[df[field].isna()].index.tolist()
                    logger.warning("  %s (%d): %s", field, cnt, markets)
            else:
                logger.info("No null agreement scores found.")
        def resolve_csv_path(input_dir: str) -> str:
            candidates = [
                os.path.join(input_dir, "mock_embeddings.csv"),
                os.path.join(input_dir, "mock_embeddings"),
            ]
            for path in candidates:
                if os.path.isfile(path):
                    logger.info("Resolved input file: %s", path)
                    return path

            # Fallback: scan directory for any csv
            for fname in os.listdir(input_dir):
                if fname.endswith(".csv"):
                    path = os.path.join(input_dir, fname)
                    logger.warning("Used fallback CSV file: %s", path)
                    return path

            # Last resort: first file in directory
            all_files = [f for f in os.listdir(input_dir)
                         if os.path.isfile(os.path.join(input_dir, f))]
            if all_files:
                path = os.path.join(input_dir, all_files[0])
                logger.warning("Used last-resort file: %s", path)
                return path

            raise FileNotFoundError(
                f"No readable input file found in: {input_dir}\n"
                f"  Contents: {os.listdir(input_dir)}"
            )

        try:
            logger.info("Scanning input dir: %s  contents=%s",
                        args.embeddings, os.listdir(args.embeddings))
            csv_path = resolve_csv_path(args.embeddings)
            logger.info("Loading embeddings from: %s", csv_path)
            df = pd.read_csv(csv_path)
            logger.info("Loaded shape=%s  REGIME_DIM=%d  mode=%s",
                        df.shape, REGIME_DIM, args.output_mode)

            df_all    = compute_all(df)
            df_latest = get_latest_year(df_all)

            logger.info("=== Agreement Scores (latest year) ===")
            logger.info("%s", df_latest.round(4).to_string())

            report_nulls(df_latest)

            # ---- Save outputs ----
            os.makedirs(args.agreement_scores,           exist_ok=True)
            os.makedirs(args.agreement_scores_all_years, exist_ok=True)

            latest_path  = os.path.join(args.agreement_scores,           "agreement_scores.csv")
            all_yrs_path = os.path.join(args.agreement_scores_all_years, "agreement_scores_all_years.csv")

            if args.output_mode == "latest":
                df_latest.round(args.round_decimals).to_csv(latest_path)
                logger.info("Saved latest-year scores → %s", latest_path)
                # Write empty placeholder for all-years output
                pd.DataFrame().to_csv(all_yrs_path, index=False)
                logger.info("output_mode=latest: skipped all-years output (empty placeholder written)")

            elif args.output_mode == "all":
                df_all.round(args.round_decimals).to_csv(all_yrs_path, index=False)
                logger.info("Saved all-years scores → %s", all_yrs_path)
                # Write empty placeholder for latest output
                pd.DataFrame().to_csv(latest_path)
                logger.info("output_mode=all: skipped latest-year output (empty placeholder written)")

            # ---- Write metadata ----
            with open(args.agreement_scores + ".meta.json", "w") as f:
                json.dump({
                    "path":        latest_path,
                    "output_mode": args.output_mode,
                    "markets":     len(df_latest),
                    "fields":      len(df_latest.columns),
                    "regime_dim":  REGIME_DIM,
                }, f, indent=2)

            with open(args.agreement_scores_all_years + ".meta.json", "w") as f:
                json.dump({
                    "path":        all_yrs_path,
                    "output_mode": args.output_mode,
                    "rows":        len(df_all),
                    "fields":      len(df_all.columns) - 2,
                    "regime_dim":  REGIME_DIM,
                }, f, indent=2)

        except Exception as e:
            logger.exception("Fatal error: %s", str(e))
            sys.exit(1)

    args:
      - --embeddings
      - {inputPath: embeddings}
      - --regime_dim
      - {inputValue: regime_dim}
      - --output_mode
      - {inputValue: output_mode}
      - --round_decimals
      - {inputValue: round_decimals}
      - --agreement_scores
      - {outputPath: agreement_scores}
      - --agreement_scores_all_years
      - {outputPath: agreement_scores_all_years}
