name: Data downlaoder CDN
inputs:
  - {name: data_file_cdn, type: String, optional: false}
outputs:
  - {name: DataFile, type: Data}

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v1
    command:
      - python3
      - -u
      - -c
      - |
        import argparse, os, sys, logging
        import requests
        from requests.adapters import HTTPAdapter
        try:
            from urllib3.util import Retry
        except Exception:
            from urllib3 import Retry

        parser = argparse.ArgumentParser()
        parser.add_argument('--data_file_cdn', required=True)
        parser.add_argument('--DataFile', required=True)
        args = parser.parse_args()

        logging.basicConfig(stream=sys.stdout, level=logging.INFO)
        logger = logging.getLogger("embedding_downloader")

        session = requests.Session()
        retry = Retry(total=5, backoff_factor=1, status_forcelist=[500, 502, 503, 504])
        session.mount("http://", HTTPAdapter(max_retries=retry))
        session.mount("https://", HTTPAdapter(max_retries=retry))

        try:
            # Extract filename from URL
            file_name = args.data_file_cdn.split("?")[0].rstrip("/").split("/")[-1]
            logger.info("Downloading from: %s", args.data_file_cdn)
            logger.info("Saving as: %s", file_name)

            r = session.get(args.data_file_cdn, timeout=60, stream=True)
            r.raise_for_status()

            os.makedirs(args.embedding, exist_ok=True)
            save_path = os.path.join(args.embedding, file_name)

            with open(save_path, "wb") as f:
                for chunk in r.iter_content(chunk_size=8192):
                    if chunk:
                        f.write(chunk)

            logger.info("Successfully saved to: %s", save_path)

        except Exception as e:
            logger.exception("Fatal error: %s", str(e))
            sys.exit(1)

    args:
      - --data_file_cdn
      - {inputValue: data_file_cdn}
      - --embedding
      - {outputPath: DataFile}
