name: Structural Normality Calculator V1.1
description: Computes structural normality per market x year from e_m regime sub-vector norms. Outputs latest, all-years, or both. REGIME_DIMS and FIELD_REGIME_MAP hardcoded.

inputs:
  - {name: e_m_data,           type: Data,    description: "Input directory containing the e_m embeddings CSV file"}
  - {name: output_mode,        type: String,  default: "both",  description: "Output mode: latest, all, or both"}
  - {name: total_vector_size,  type: Integer, default: "320",   description: "Total dimensionality of the e_m embedding vector (e_0 to e_N-1)"}
  - {name: output_fractions,   type: String,  default: "false", description: "Set true to also save error_fraction CSVs alongside normality CSVs"}
  - {name: round_decimals,     type: Integer, default: "6",     description: "Decimal places to round output scores"}

outputs:
  - {name: structural_normality,          type: Data, description: "structural_normality.csv — latest year per market (indexed by market)"}
  - {name: structural_normality_all_years, type: Data, description: "structural_normality_all_years.csv — all years (no index)"}

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v1
    command:
      - python3
      - -u
      - -c
      - |
        import argparse, os, sys, json, logging
        import numpy as np
        import pandas as pd

        parser = argparse.ArgumentParser()
        parser.add_argument('--e_m_data',                         required=True)
        parser.add_argument('--output_mode',                      type=str,  default='both',
                            choices=['latest', 'all', 'both'])
        parser.add_argument('--total_vector_size',                type=int,  default=320)
        parser.add_argument('--output_fractions',                 type=str,  default='false',
                            help="'true' to also emit error_fraction CSVs")
        parser.add_argument('--round_decimals',                   type=int,  default=6)
        parser.add_argument('--structural_normality',             required=True)
        parser.add_argument('--structural_normality_all_years',   required=True)
        args = parser.parse_args()

        logging.basicConfig(stream=sys.stdout, level=logging.INFO)
        logger = logging.getLogger("structural_normality_calculator")

        EMIT_FRACTIONS    = args.output_fractions.strip().lower() == 'true'
        TOTAL_VECTOR_SIZE = args.total_vector_size
        E_COLS            = [f"e_{i}" for i in range(TOTAL_VECTOR_SIZE)]

        # ================================================================
        # Hardcoded: REGIME_DIMS
        # Format: regime_key -> [start, end]  (end exclusive)
        # ================================================================
        REGIME_DIMS = {
            # 9 full regime blocks (32 dims each)
            "political":    [0,   32],
            "measurement":  [32,  64],
            "coordination": [64,  96],
            "regulatory":   [96,  128],
            "techprod":     [128, 160],
            "operational":  [160, 192],
            "narrative":    [192, 224],
            "incentive":    [224, 256],
            "temporal":     [256, 288],

            # coordination sub-slices [64–96]
            "supply_dims":  [64,  75],
            "buyer_dims":   [75,  85],
            "rivalry_dims": [85,  96],

            # regulatory sub-slices [96–128]
            "entry_dims":   [96,  107],
            "enforce_dims": [107, 118],

            # techprod sub-slices [128–160]
            "sub_dims":     [128, 139],
            "digital_dims": [139, 150],
            "std_dims":     [150, 160],

            # narrative sub-slice [192–224]
            "env_dims":     [192, 203],

            # agency block [288–320]
            "agency":       [288, 320],
        }

        # ================================================================
        # Hardcoded: FIELD_REGIME_MAP
        # ================================================================
        FIELD_REGIME_MAP = {
            # PESTLE (6)
            "PESTLE_P":        "political",
            "PESTLE_E":        "measurement",
            "PESTLE_S":        "operational",
            "PESTLE_T":        "techprod",
            "PESTLE_L":        "regulatory",
            "PESTLE_Env":      "env_dims",

            # 5 Forces + Contractibility (6)
            "5F_Supplier":     "supply_dims",
            "5F_Buyer":        "buyer_dims",
            "5F_NewEntrant":   "entry_dims",
            "5F_Substitute":   "sub_dims",
            "5F_Rivalry":      "rivalry_dims",
            "Contractibility": "enforce_dims",

            # Data (2)
            "DataExhaust":     "digital_dims",
            "StdGap":          "std_dims",
        }

        FIELDS = list(FIELD_REGIME_MAP.keys())

        # ================================================================
        # Core computation helpers
        # ================================================================
        def _regime_fractions(e_m: np.ndarray) -> dict:
            total_norm = float(np.linalg.norm(e_m))
            if total_norm == 0 or not np.isfinite(total_norm):
                return {f: np.nan for f in FIELDS}
            return {
                field: float(np.linalg.norm(e_m[REGIME_DIMS[rk][0]:REGIME_DIMS[rk][1]])) / total_norm
                for field, rk in FIELD_REGIME_MAP.items()
            }

        def compute_normality_for_row(e_m: np.ndarray) -> dict:
            fracs = _regime_fractions(e_m)
            return {f: round(float(np.clip(1.0 - v, 0.0, 1.0)), args.round_decimals) if not np.isnan(v) else np.nan for f, v in fracs.items()}

        def compute_fraction_for_row(e_m: np.ndarray) -> dict:
            fracs = _regime_fractions(e_m)
            return {f: round(v, args.round_decimals) if not np.isnan(v) else np.nan for f, v in fracs.items()}

        # ================================================================
        # Process all rows
        # ================================================================
        def compute_all_years(df: pd.DataFrame) -> tuple:
            norm_records     = []
            fraction_records = [] if EMIT_FRACTIONS else None

            for _, row in df.iterrows():
                missing = [c for c in E_COLS if c not in row]
                if missing:
                    logger.warning("Row market=%s year=%s missing %d e_m cols — skipping",
                                   row.get("market"), row.get("year"), len(missing))
                    continue

                e_m    = np.array(row[E_COLS].values, dtype=np.float32)
                base   = {"market": row["market"], "year": int(row["year"])}

                norm_row = dict(base)
                norm_row.update(compute_normality_for_row(e_m))
                norm_records.append(norm_row)

                if EMIT_FRACTIONS:
                    frac_row = dict(base)
                    frac_row.update(compute_fraction_for_row(e_m))
                    fraction_records.append(frac_row)

            df_norm = pd.DataFrame(norm_records)
            df_frac = pd.DataFrame(fraction_records) if EMIT_FRACTIONS else None
            return df_norm, df_frac

        def get_latest_year(df_all: pd.DataFrame) -> pd.DataFrame:
            idx = df_all.groupby("market")["year"].idxmax()
            return df_all.loc[idx].drop(columns=["year"]).set_index("market")

        def report_nulls(df: pd.DataFrame, label: str) -> None:
            null_counts = df.isna().sum()
            null_counts  = null_counts[null_counts > 0]
            if not null_counts.empty:
                logger.warning("Null scores in %s:", label)
                for field, cnt in null_counts.items():
                    markets = df[df[field].isna()].index.tolist()
                    logger.warning("  %s (%d nulls): %s", field, cnt, markets)
            else:
                logger.info("✓ No null scores in %s", label)

        # ================================================================
        # Main
        # ================================================================
        def resolve_csv_path(input_dir: str) -> str:
            candidates = [
                os.path.join(input_dir, "mock_e_m.csv"),
                os.path.join(input_dir, "mock_e_m"),
            ]
            for path in candidates:
                if os.path.isfile(path):
                    logger.info("Resolved input file: %s", path)
                    return path
            for fname in os.listdir(input_dir):
                if fname.endswith(".csv"):
                    path = os.path.join(input_dir, fname)
                    logger.warning("Fallback CSV file used: %s", path)
                    return path
            all_files = [f for f in os.listdir(input_dir) if os.path.isfile(os.path.join(input_dir, f))]
            if all_files:
                path = os.path.join(input_dir, all_files[0])
                logger.warning("Last-resort file used: %s", path)
                return path
            raise FileNotFoundError("No readable input file found in: %s  contents: %s" % (input_dir, os.listdir(input_dir)))

        try:
            logger.info("Scanning input dir: %s  contents=%s", args.e_m_data, os.listdir(args.e_m_data))
            csv_path = resolve_csv_path(args.e_m_data)
            logger.info("Loading e_m embeddings from: %s", csv_path)
            df_raw = pd.read_csv(csv_path)
            assert "market" in df_raw.columns, "Missing 'market' column"
            assert "year"   in df_raw.columns, "Missing 'year' column"
            assert "e_0"    in df_raw.columns, "Missing e_m vector columns (e_0 ...)"
            logger.info("Loaded shape=%s  total_vector_size=%d  output_mode=%s  emit_fractions=%s",
                        df_raw.shape, TOTAL_VECTOR_SIZE, args.output_mode, EMIT_FRACTIONS)

            # ── Compute ──────────────────────────────────────────────────
            df_all_norm, df_all_frac = compute_all_years(df_raw)
            df_latest_norm           = get_latest_year(df_all_norm)

            logger.info("=== Structural Normality (latest year) ===")
            logger.info("%s", df_latest_norm.round(4).to_string())
            report_nulls(df_latest_norm, "latest-year normality")

            # ── Output dirs ──────────────────────────────────────────────
            os.makedirs(args.structural_normality,            exist_ok=True)
            os.makedirs(args.structural_normality_all_years,  exist_ok=True)

            latest_path   = os.path.join(args.structural_normality,           "structural_normality.csv")
            all_yrs_path  = os.path.join(args.structural_normality_all_years, "structural_normality_all_years.csv")
            frac_lat_path = os.path.join(args.structural_normality,           "error_fraction.csv")
            frac_all_path = os.path.join(args.structural_normality_all_years, "error_fraction_all_years.csv")

            mode = args.output_mode

            # ── Latest year ──────────────────────────────────────────────
            if mode in ("latest", "both"):
                df_latest_norm.round(args.round_decimals).to_csv(latest_path)
                logger.info("Saved latest-year normality → %s", latest_path)

                if EMIT_FRACTIONS and df_all_frac is not None:
                    df_latest_frac = get_latest_year(df_all_frac)
                    df_latest_frac.round(args.round_decimals).to_csv(frac_lat_path)
                    logger.info("Saved latest-year fractions → %s", frac_lat_path)
            else:
                pd.DataFrame().to_csv(latest_path)
                logger.info("output_mode=%s: skipped latest-year (placeholder written)", mode)

            # ── All years ────────────────────────────────────────────────
            if mode in ("all", "both"):
                df_all_norm.round(args.round_decimals).to_csv(all_yrs_path, index=False)
                logger.info("Saved all-years normality → %s", all_yrs_path)

                if EMIT_FRACTIONS and df_all_frac is not None:
                    df_all_frac.round(args.round_decimals).to_csv(frac_all_path, index=False)
                    logger.info("Saved all-years fractions → %s", frac_all_path)
            else:
                pd.DataFrame().to_csv(all_yrs_path, index=False)
                logger.info("output_mode=%s: skipped all-years (placeholder written)", mode)

            # ── Assertions ───────────────────────────────────────────────
            valid = df_latest_norm.dropna()
            assert (valid >= 0).all().all(), "Normality score below 0 detected"
            assert (valid <= 1).all().all(), "Normality score above 1 detected"
            assert len(FIELD_REGIME_MAP) == 14, "Expected 14 fields in FIELD_REGIME_MAP"
            logger.info("✓ 14 fields confirmed")
            logger.info("✓ Bounds [0,1] passed")
            logger.info("✓ All years rows: %d", len(df_all_norm))
            logger.info("✓ Latest year markets: %d", len(df_latest_norm))

            # ── Metadata ─────────────────────────────────────────────────
            with open(args.structural_normality + ".meta.json", "w") as f:
                json.dump({
                    "path":              latest_path,
                    "output_mode":       mode,
                    "markets":           len(df_latest_norm),
                    "fields":            len(df_latest_norm.columns),
                    "total_vector_size": TOTAL_VECTOR_SIZE,
                    "emit_fractions":    EMIT_FRACTIONS,
                }, f, indent=2)

            with open(args.structural_normality_all_years + ".meta.json", "w") as f:
                json.dump({
                    "path":              all_yrs_path,
                    "output_mode":       mode,
                    "rows":              len(df_all_norm),
                    "fields":            len(df_all_norm.columns) - 2,
                    "total_vector_size": TOTAL_VECTOR_SIZE,
                    "emit_fractions":    EMIT_FRACTIONS,
                }, f, indent=2)

        except Exception as e:
            logger.exception("Fatal error: %s", str(e))
            sys.exit(1)

    args:
      - --e_m_data
      - {inputPath: e_m_data}
      - --output_mode
      - {inputValue: output_mode}
      - --total_vector_size
      - {inputValue: total_vector_size}
      - --output_fractions
      - {inputValue: output_fractions}
      - --round_decimals
      - {inputValue: round_decimals}
      - --structural_normality
      - {outputPath: structural_normality}
      - --structural_normality_all_years
      - {outputPath: structural_normality_all_years}
